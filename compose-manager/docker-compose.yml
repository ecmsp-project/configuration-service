name: ecmsp-full

services:
    gateway-service:
        build:
            context: ${ESCAPE_PATH}/gateway-service/
            dockerfile: Dockerfile
        # container_name: gateway-service
        volumes:
            - ./env/keys:/keys
        ports:
            - "${GATEWAY_SERVICE_PORT:?error}:8080"
            - "${GATEWAY_SERVICE_GRPC_PORT:?error}:50051"
        env_file:
            -
                path: ./env/gateway-service/app-env.txt
                required: false
        environment:
            - SPRING_PROFILES_ACTIVE=${GATEWAY_SERVICE_SPRING_PROFILES_ACTIVE:-compose}
            - JWT_PUBLIC_KEY_PATH=file:/keys/local.public.key
        networks:
            - ecmsp-full
        depends_on:
            kafka:
                condition: service_healthy
        profiles: [gateway-service]

    user-service:
        build:
            context: ${ESCAPE_PATH}/user-service/
            dockerfile: Dockerfile
        # container_name: user-service
        volumes:
            - ./env/keys:/keys
        ports:
            - "${USER_SERVICE_PORT:?error}:8080"
        env_file:
            -
                path: ./env/user-service/app-env.txt
                required: false
        environment:
            - SPRING_PROFILES_ACTIVE=${USER_SERVICE_SPRING_PROFILES_ACTIVE:-compose}
            # - AUTH_SECRET_KEY_FILE=/run/secrets/jwt-private-key
            - AUTH_TOKEN_GENERATOR_SECRET_KEY_FILE=/keys/local.private.key
        networks:
            - ecmsp-full
        depends_on:
            user-service-db:
                restart: true
                condition: service_healthy
            kafka:
                condition: service_healthy
        profiles: [user-service]
    user-service-db:
        image: postgres:15-alpine
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s
        ports:
            - "${USER_SERVICE_DB_PORT:?error}:5432"
        volumes:
            - ${ESCAPE_PATH}/user-service/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
            - user-service-db:/var/lib/postgresql/data
        secrets:
            - user-service-db-password
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_DB=user-service-db
            - POSTGRES_PASSWORD_FILE=/run/secrets/user-service-db-password
        networks:
            - ecmsp-full
        env_file:
            -
                path: ./env/user-service-db/database-env.txt
                required: false
        profiles: [user-service]

